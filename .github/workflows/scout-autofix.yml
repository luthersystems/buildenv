name: Scout autofix

# Layer 3 of the grade-A upkeep loop: turn a `Scout drift watch` failure into a
# remediation, via the official Claude GitHub App (claude-code-action). The agent
# reads the open `scout-drift` issue (incl. its sla:* deadline labels), reproduces
# with `docker scout`, and per the /scout-fix skill:
#   * ships a strictly-better rebuild NOW as a PATCH release (fresh base/OS, or a
#     fix already merged but unpublished) — even while a deeper source fix is still
#     in review; skips a rebuild that would change nothing.
#   * opens a PR for any fix needing a NEW source change (human merges within the
#     SLA; the next daily cycle then ships it as a patch release).
#   * opens a VEX waiver PR (OpenVEX not_affected + a .github/vex-ttl.json
#     expiry, default 90 days) when Scout lists a fix that no upstream release
#     ships yet. Owner policy 2026-10-28 (#180): without it the run could only
#     comment, and the finding stayed red until upstream shipped. The TTL makes
#     the gate fail again so someone re-checks upstream.
#   * comments when the only findings have no fix anywhere, or a waiver would
#     be false (the vulnerable code is reachable).
# The customer remediation SLA (15d fixable Critical / 30d High) lives in
# .github/scout-sla.json and is tracked + escalated by scout-drift.yml.
#
# Fences: branch protection means a PR can only be PROPOSED (a human merges);
# automation's releases are PATCH-only (scripts/next-patch-version.sh) and ride a
# report-only grade gate, while human-cut releases stay hard grade-A (CLAUDE.md
# rule 1, publish.yml `release-meta`). Uses the official Claude App (NOT a passed
# github_token) so the agent's PR and its `gh release create` both trigger our
# required checks / publish.yml — the default GITHUB_TOKEN would not.
#
# Model auth: chosen by the repo variable CLAUDE_MODEL_PROVIDER, validated by
# scripts/claude-model-auth.sh (#82). Unset = the ~1-year Claude subscription
# token (op://Reliable-Dev/CLAUDE_CODE_OAUTH_TOKEN -> repo secret
# CLAUDE_CODE_OAUTH_TOKEN). "bedrock" = Amazon Bedrock via GitHub OIDC
# (vars AWS_ROLE_TO_ASSUME, AWS_REGION, BEDROCK_MODEL) — the durable end state:
# no token to rotate and no weekly usage cap.
on:
  workflow_run:
    workflows: ["Scout drift watch"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write # PR branch commits AND `gh release create` (the section-F patch release)
  pull-requests: write
  issues: write
  id-token: write # lets claude-code-action mint the official Claude app token, so its PR / release triggers our required checks

concurrency:
  group: scout-autofix
  cancel-in-progress: false

jobs:
  autofix:
    name: Auto-fix Scout drift
    # only when the weekly drift watch actually found a grade regression
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-22.04
    # 60 was not enough headroom once the turn budget below was raised: at the
    # measured ~28s/turn, 150 turns needs ~70min. Raising both together so the
    # turn cap is actually reachable rather than trading one cap for the other.
    timeout-minutes: 120 # rebuilding/scanning from source is heavy
    # Docker Hub login is OIDC only (no stored credential; see CLAUDE.md,
    # "Docker Hub login"). The token lives 60 min with no refresh, but the
    # agent can run 120: it re-logs in with scripts/dockerhub-oidc-login.sh.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0  (puts .claude/skills/scout-fix + scripts/ on disk)
        with:
          # MUST stay false. checkout v7 persists the default GITHUB_TOKEN as an
          # `http.https://github.com/.extraheader` in a separate credentials file
          # wired in via `includeIf.gitdir`. claude-code-action only strips a
          # plain `--local` extraheader ("No existing authentication headers to
          # remove"), so the GITHUB_TOKEN header survived and took precedence
          # over the app token it puts in the remote URL: every agent `git push`
          # authenticated as github-actions[bot], not claude[bot]. Those pushes'
          # `pull_request` runs then sat in `action_required` waiting for a
          # maintainer, which stalled fix PR #127 for ~14 days (runs 34320888480,
          # 34447929119, 34573686718 — actor github-actions[bot]; the PR's
          # opening run 33847261645, actor claude[bot], ran immediately).
          # Without persisted creds, git uses only the app token.
          persist-credentials: false
      - name: Configure DockerHub # log the runner's docker in so the agent's pulls / scout are authenticated
        uses: ./.github/actions/configure-dockerhub
      - name: Install Docker Scout CLI # pre-install so the agent doesn't spend a turn fetching it (observed in the validation trace)
        run: bash scripts/install-scout-cli.sh # pinned + sha256-verified; version in common.config.mk (#120)
      # Model auth (#82): repo variable CLAUDE_MODEL_PROVIDER picks the subscription
      # token (unset, the default) or Amazon Bedrock via OIDC ("bedrock"). The
      # script fails here, naming each missing setting, before the agent starts.
      - name: Check Claude model auth
        id: auth
        env:
          CLAUDE_MODEL_PROVIDER: ${{ vars.CLAUDE_MODEL_PROVIDER }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL: ${{ vars.BEDROCK_MODEL }}
          BEDROCK_FALLBACK_MODEL: ${{ vars.BEDROCK_FALLBACK_MODEL }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          DIRECT_MODEL: claude-opus-4-8
          DIRECT_FALLBACK_MODEL: claude-sonnet-5-5
        run: bash scripts/claude-model-auth.sh
      - name: Configure AWS credentials for Bedrock (OIDC)
        if: ${{ vars.CLAUDE_MODEL_PROVIDER == 'bedrock' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run /scout-fix
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          # A from-source image build takes ~20 minutes (build-godynamic), past
          # Claude Code's default 10-minute ceiling on a foreground Bash call.
          # With that ceiling the agent backgrounds the build and waits for a
          # notification that a headless run never delivers (run 40644785612,
          # #180). Raise the ceiling so it can wait in the foreground.
          settings: |
            {"env": {"BASH_DEFAULT_TIMEOUT_MS": "600000", "BASH_MAX_TIMEOUT_MS": "3600000"}}
          # Official-app auth (claude-code-action mints the app token via OIDC,
          # using id-token: write above). Do NOT add a `github_token:` here — that
          # makes the action skip the official-app exchange, and a default
          # GITHUB_TOKEN does not trigger publish.yml / required checks, which the
          # agent's release + PR depend on.
          claude_code_oauth_token: ${{ vars.CLAUDE_MODEL_PROVIDER != 'bedrock' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          use_bedrock: ${{ vars.CLAUDE_MODEL_PROVIDER == 'bedrock' && 'true' || 'false' }}
          prompt: |
            /scout-fix
            The daily "Scout drift watch" failed. Read the open `scout-drift` issue —
            note any `sla:critical` / `sla:high` / `sla:at-risk` / `sla:breached`
            labels: those carry the customer remediation deadline (.github/scout-sla.json
            — 15 days for a fixable Critical, 30 for a High). Reproduce with
            `docker scout` and remediate per the skill, in this priority order:

            1. If a REBUILD would be strictly better than the published image (fresh
               base digest, newer OS packages, OR a fix already merged to main but not
               yet published): cut the next PATCH release now —
               `scripts/next-patch-version.sh` + `gh release create` — so publish.yml
               ships the improvement. Do this EVEN IF a separate source fix is still
               pending its PR; shipping the posture gain immediately is the point. PATCH
               ONLY, never hand-pick a tag. Skip only if a rebuild would change nothing
               (`docker scout compare` shows no improvement).
            2. If a finding needs a NEW source change not yet in main (a fixable CVE
               needing a Dockerfile/dep edit): apply the minimal NON-BREAKING fix,
               self-check with /verify-scout, and open a PR. Do NOT merge — a human
               reviews within the SLA. The next daily cycle ships it via a patch release
               once merged.
            3. If Scout lists a fixed version but NO upstream release the image
               consumes ships it yet (for example the fix is only on an unreleased
               branch): do not force a bump or hand-swap a jar. Open ONE PR that adds,
               per finding, an OpenVEX `not_affected` statement under .github/vex/
               (with the matching GHSA alias), an entry in .github/vex-ttl.json that
               expires 90 days from today and names the scout-drift issue as "#N"
               (check it with `make vex-ttl-check`), and a docs/upstream-cve-backlog.md entry
               naming the source path, why the code is not reachable, and the drop
               trigger (the upstream release to wait for). Follow the skill's
               "No upstream fix released yet" rule. Do NOT merge — a person reviews
               a waiver. If the vulnerable code IS reachable with attacker input, a
               waiver would be false: comment on the scout-drift issue and escalate
               instead.
            4. If the only findings have no fix anywhere (no fixed version at all):
               comment that on the scout-drift issue; open nothing, cut nothing.

            Docker Hub auth: the runner is logged in with a Docker Hub OIDC token
            that expires 60 minutes after the job's "Configure DockerHub" step,
            with no refresh. If `docker` or `docker scout` fails with 401 /
            "unauthorized" / "incorrect username or password", run
            `bash scripts/dockerhub-oidc-login.sh` once and retry. Do not ask for
            or use any other Docker Hub credential.

            This run is one-shot and headless: when you end your turn the job ends,
            and nothing ever re-invokes you. Do not run commands in the background,
            schedule a wakeup or wait on a monitor. Run each build and scan in the
            foreground with a Bash timeout up to 3600000 ms, and finish (release, PR,
            issue comment) before you end your turn. A run that ends with work
            deferred fails the job.

            Steps 1 and 2 are NOT mutually exclusive — ship the rebuild now AND open the
            PR for the deeper fix. Never weaken posture to go green; when unsure,
            escalate on the issue.
          claude_args: |
            --allowedTools Bash,Edit,Write,Read,Grep,Glob,MultiEdit
            # These tools only work when something re-invokes the agent later,
            # and a headless run is never re-invoked: on 2026-10-28 (run
            # 40644785612) the agent called Monitor and ScheduleWakeup, ended its
            # turn with nothing done, and the job went green.
            --disallowedTools ScheduleWakeup,CronCreate,CronDelete,CronList,Monitor
            # Raised 50 -> 150 after five consecutive daily failures (2026-08-14
            # through 08-18) on issue #115, every one of them
            # "error_max_turns ... Reached maximum number of turns (50)" at
            # exactly 51 turns. That drift hit FIVE images at once
            # (build-api, build-go, build-go-alpine, build-godynamic,
            # build-java); diagnosing each with docker scout does not fit in 50
            # turns, so the remediation layer died daily while an sla:critical
            # clock ran and nothing shipped. Runs cost ~$5 and 24min each to
            # produce nothing.
            --max-turns 150
            --model ${{ steps.auth.outputs.model }}
            ${{ steps.auth.outputs.fallback_args }}
      # A run that defers work (a wakeup, cron or monitor) ends with is_error
      # false, so the job was green and the failure comment and Slack alert
      # below never fired (run 40644785612, #180: nothing shipped for the open
      # Critical, and nobody was told). Fail it here so they do.
      - name: Verify the agent finished its pass
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { verifyCompleted } = require('./scripts/scout-autofix-failure-comment.cjs');
            verifyCompleted({ core });
      # Capture the agent's full stream-json conversation log for troubleshooting.
      # claude-code-action hides the transcript from the job log ("full output
      # hidden for security") and writes it to
      # $RUNNER_TEMP/claude-execution-output.json, otherwise wiped on runner reclaim.
      # always() so we capture even a failed/timed-out run. NOTE: this is a PUBLIC
      # repo, so the artifact is repo-readable; the trace can contain secret-shaped
      # strings the log-masker misses. Acceptable here (validated clean once, low
      # value to an attacker), short retention as a backstop. If that ever stops
      # being acceptable, route this to private storage instead of dropping it.
      - name: Capture agent trace (conversation log)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scout-autofix-trace-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 14
          if-no-files-found: warn
      # Slack is ephemeral and nobody re-reads it; the scout-drift issue is the
      # durable SLA record. Until this step existed a dead autofix left NO trace
      # there, which is exactly how 2026-08-14..18 went unnoticed for five days
      # (five error_max_turns failures against an sla:critical issue, #115).
      # Logic lives in scripts/ per CLAUDE.md rule 5; this stays a thin shim.
      - name: Flag the failure on the scout-drift issue
        id: flag
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require('./scripts/scout-autofix-failure-comment.cjs');
            await run({ github, context, core });
      # Silence must never look green — the same principle as scout-drift.yml's
      # "watch errored" alert, which this mirrors. Without it the REMEDIATION
      # layer can be dead for days with no signal anywhere: on 2026-08-01..03
      # this job died in <1 min on three consecutive days with a 429 "you've hit
      # your weekly limit" (subscription-token `seven_day` cap), while an open
      # sla:high drift issue sat unremediated. Nobody found out until a
      # human happened to look. See #109 (gap 2) and #82 (Bedrock swap).
      # The text (with the parsed cause, e.g. the 429 + reset time) comes from
      # the flag step's `slack_text` output; the fallback covers that step
      # itself failing. Passed via env, never interpolated into the script.
      # Runs last so the trace artifact above is captured first.
      - name: Alert Slack if autofix itself errored
        if: failure()
        env:
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
          SLACK_TEXT: ${{ steps.flag.outputs.slack_text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          fallback="❌ *Scout autofix FAILED* — cause unknown (the failure-comment step also failed). Today's remediation pass did NOT complete, so any new finding on the open \`scout-drift\` issue is unhandled while its SLA clock runs. Needs a human. <${RUN_URL}|View run>"
          bash scripts/slack-alert.sh "${SLACK_TEXT:-$fallback}"
