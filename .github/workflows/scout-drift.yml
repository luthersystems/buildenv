name: Scout drift watch

# Layer 2 of keeping the required images at grade A (see README "Image security
# policies"). The PR gate (build.yml) and release gate (publish.yml) only fire on
# code changes — but a CVE disclosed today against an UNCHANGED pin drops the
# grade with no commit to trigger a scan. This cron re-evaluates the Docker Scout
# grade (scripts/scout-grade.sh) on the published `:latest` images, opens/refreshes a tracking
# issue + reds the run on drift, and auto-closes it on recovery.
#
# It also enforces the customer remediation SLA (.github/scout-sla.json): it
# classifies the WORST fixable severity (Critical/High) behind the drift, labels
# the issue, and ESCALATES (sla:at-risk / sla:breached + a comment) as the
# 15-day (Critical) / 30-day (High) deadline approaches — so a fixable finding
# that needs a human-reviewed PR can never silently blow the SLA. Runs DAILY (not
# weekly) precisely so the clock is checked every day.
on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write # Docker Hub OIDC login (no stored credential; see CLAUDE.md, "Docker Hub login")

jobs:
  drift:
    name: Docker Scout drift watch (published :latest)
    runs-on: ubuntu-22.04
    outputs:
      images: ${{ steps.scan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Docker Scout has no anonymous mode: fail loudly (and alert, via the
      # "watch errored" step) when the OIDC login fails.
      - name: Configure DockerHub
        uses: ./.github/actions/configure-dockerhub
      - name: Install Docker Scout CLI
        run: bash scripts/install-scout-cli.sh # pinned + sha256-verified; version in common.config.mk (#120)
      # The from-source Docker CLI build (#115) is a workaround for Docker
      # publishing its CLI on an older Go than our GOLANG_VERSION. Its risk is
      # becoming permanent by inertia, so the daily watch checks the exit
      # condition and emits a ::notice:: once a published CLI catches up.
      # Report-only: never fails the watch. Logic: scripts/
      # docker-cli-source-build-check.sh (also `make docker-cli-check`).
      - name: Check whether the from-source Docker CLI build can be retired
        run: bash scripts/docker-cli-source-build-check.sh || echo "::warning::docker-cli-source-build-check.sh failed; continuing"
      # The OIDC token lives 60 min with no refresh: start the scan on a fresh
      # one and keep the scan inside that hour.
      - name: Refresh Docker Hub login (before scan)
        uses: ./.github/actions/configure-dockerhub
      - name: Grade each required :latest image (no org-level Scout call)
        id: scan
        timeout-minutes: 60
        # The grade is rebuilt from image-level checks in scripts/scout-grade.sh:
        # `docker scout policy` and Scout enrollment are org-level API calls,
        # which an OIDC token cannot make (403; #150). scout-grade.sh is
        # VEX-aware and fail-closed: an image whose checks cannot run is drift.
        run: |
          set +e -uo pipefail
          drift=0
          worst="none" # severity ranking: none < high < critical
          echo "images=$(jq -c '.required' .github/scout-required-images.json)" >> "$GITHUB_OUTPUT"
          {
            echo "## Docker Scout grade drift on published \`:latest\` images"
            echo
            echo "Re-evaluated by the daily \`Scout drift watch\` workflow (\`scripts/scout-grade.sh\`)."
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
          } > summary.md
          for img in $(jq -r '.required[]' .github/scout-required-images.json); do
            ref="luthersystems/${img}:latest"
            echo "::group::grade $ref"
            rm -f grade.out
            SCOUT_GRADE_OUT=grade.out bash scripts/scout-grade.sh "$ref" "$img" || true
            val() { sed -n "s/^$1=//p" grade.out 2>/dev/null; }
            crit="$(val critical)"; high="$(val high)"
            if [ "$(val grade)" = pass ]; then
              status="✅ grade A"
            else
              drift=1
              failed="$(grep -E '=(yes|error)$' grade.out 2>/dev/null | paste -sd, - || true)"
              status="❌ below grade A (${failed:-grade not read})"
            fi
            [ "$(val base)" = stale ] && status="${status}; base image has a newer digest (report only)"
            [ "$crit" = yes ] && worst="critical"
            [ "$high" = yes ] && [ "$worst" != critical ] && worst="high"
            echo "- \`${img}\` — ${status}; fixable Critical: ${crit:-error}, fixable High: ${high:-error}" >> summary.md
            echo "::endgroup::"
          done
          echo "drift=${drift}" >> "$GITHUB_OUTPUT"
          echo "worst_severity=${worst}" >> "$GITHUB_OUTPUT"
          echo "----- summary -----"; cat summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      # Issue/SLA state machine + Slack #alerts egress live in
      # scripts/scout-drift-sla.cjs (logic stays out of workflow YAML). Slack
      # alerts for the drift/SLA lifecycle are posted INLINE from this watch —
      # not from an issues:-triggered workflow — because this issue is created
      # with the default GITHUB_TOKEN, whose events do NOT trigger other
      # workflows (GitHub's anti-recursion guard). Best-effort egress: no-op
      # until SLACK_ALERT_WEBHOOK_URL is set; a Slack outage never fails the
      # watch (the issue + labels remain the durable SLA record).
      - name: Open/refresh the drift issue + enforce the remediation SLA
        if: steps.scan.outputs.drift == '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          WORST_SEVERITY: ${{ steps.scan.outputs.worst_severity }}
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
        with:
          script: |
            const run = require('./scripts/scout-drift-sla.cjs');
            await run({ github, context, core });
      - name: Close the drift issue on recovery
        # Fully clean scan (drift == '0') → auto-close any open scout-drift
        # issue so the loop self-resets, and post the ✅ all-clear to Slack.
        # Logic in scripts/scout-drift-recovery.cjs.
        if: steps.scan.outputs.drift == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
        with:
          script: |
            const run = require('./scripts/scout-drift-recovery.cjs');
            await run({ github, context, core });
      - name: Fail the run if drift detected
        if: steps.scan.outputs.drift == '1'
        run: |
          echo "::error::One or more published images dropped below Docker Scout grade A — see the 'scout-drift' issue."
          exit 1
      # Silence must never look green: if the watch ITSELF errored (scan crash,
      # API failure — yesterday's #90 class), say so in Slack. Excludes the
      # deliberate drift failure right above (drift == '1'), which already
      # alerted with full context from the SLA step.
      - name: Alert Slack if the watch itself errored
        if: failure() && steps.scan.outputs.drift != '1'
        env:
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
        run: |
          bash scripts/slack-alert.sh "⚠️ *Scout drift watch errored* — the watch itself broke (no drift verdict; silence is not green). <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"

  # Readable per-image CVE overview in the run summary (docker/scout-action
  # quickview). Report only: the verdict is the drift job's scout-grade.sh.
  quickview:
    name: Scout quickview (${{ matrix.image }}, report only)
    needs: drift
    if: always() && needs.drift.outputs.images != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.drift.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Configure DockerHub
        uses: ./.github/actions/configure-dockerhub
      - name: Scout quickview of luthersystems/${{ matrix.image }}:latest
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864  # v1.26.0
        continue-on-error: true
        with:
          command: quickview,cves
          image: luthersystems/${{ matrix.image }}:latest
          only-fixed: true
          only-severities: critical,high
          vex-location: .github/vex
          summary: true
          exit-code: false
          write-comment: false
