name: ci-dockerhub-login
description: >-
  Pull-only Docker Hub login for PR image builds. Logs in with Docker Hub OIDC
  (docker/login-action), up to three attempts, with no stored credential.
  Every image these builds pull from Docker Hub is public, so a run that cannot
  log in pulls anonymously (rate-limited) instead of failing: an empty
  connection ID, a run without an id-token (fork pull requests) and three
  failed attempts each warn and continue. Never use this for a push or a
  Docker Scout command: those use .github/actions/configure-dockerhub, which
  fails the job when it cannot log in. Token lifetime and refresh rules are the
  same as configure-dockerhub (see its description).
inputs:
  connection-id:
    description: >-
      Docker Home OIDC connection ID (not a secret). Callers pass the repo
      variable `vars.DOCKERHUB_OIDC_CONNECTIONID`.
    required: false
    default: ""
  username:
    description: Docker organization OIDC authenticates as (not a user).
    required: false
    default: luthersystems
  oidc-expires-in:
    description: Lifetime in seconds (300-3600) of the OIDC-issued Docker Hub token.
    required: false
    default: "3600"
runs:
  using: composite
  steps:
    - name: Check OIDC availability
      id: check
      shell: bash
      env:
        CONNECTION_ID: ${{ inputs.connection-id }}
      run: |
        if [ -z "$CONNECTION_ID" ]; then
          echo "::warning title=Docker Hub login::repo variable DOCKERHUB_OIDC_CONNECTIONID is empty; pulls are anonymous and rate-limited"
          echo "oidc=false" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "oidc=true" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          echo "No id-token (fork pull request); skipping Docker Hub login, pulls are anonymous"
        else
          echo "::warning title=Docker Hub login::no id-token on a $GITHUB_EVENT_NAME run; pulls are anonymous and rate-limited. Give the job 'permissions: id-token: write'"
        fi
        echo "oidc=false" >>"$GITHUB_OUTPUT"
    - name: Log in to Docker Hub (OIDC, attempt 1)
      id: oidc1
      if: steps.check.outputs.oidc == 'true'
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        username: ${{ inputs.username }}
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: ${{ inputs.oidc-expires-in }}
    - name: Wait before OIDC retry
      if: steps.oidc1.outcome == 'failure'
      shell: bash
      run: sleep 5
    - name: Log in to Docker Hub (OIDC, attempt 2)
      id: oidc2
      if: steps.oidc1.outcome == 'failure'
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        username: ${{ inputs.username }}
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: ${{ inputs.oidc-expires-in }}
    - name: Wait before OIDC retry
      if: steps.oidc2.outcome == 'failure'
      shell: bash
      run: sleep 15
    - name: Log in to Docker Hub (OIDC, attempt 3)
      id: oidc3
      if: steps.oidc2.outcome == 'failure'
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        username: ${{ inputs.username }}
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: ${{ inputs.oidc-expires-in }}
    # A failed login must not leave an earlier, possibly expired credential in
    # the Docker config: a stale credential fails even public pulls with 401,
    # and an absent one pulls anonymously.
    - name: Fall back to anonymous pulls
      if: steps.oidc3.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=Docker Hub OIDC failed::OIDC login failed 3 times; pulls are anonymous and rate-limited"
        docker logout docker.io || true
