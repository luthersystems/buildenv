name: Build Docker Images
description: A custom action to build Docker images for specified platforms and images
inputs:
  arch:
    description: The platform architecture
    required: true
  image:
    description: The image to build
    required: true
  git_tag:
    description: Git release tag
    default: ""
  git_rev:
    description: Git commit hash
    default: ""
  dockerhub-oidc-connection-id:
    description: >-
      Docker Home OIDC connection ID (the caller passes
      vars.DOCKERHUB_OIDC_CONNECTIONID; a composite action cannot read vars).
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Install Docker (ARM runners)
      if: runner.arch == 'ARM64'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl gnupg make
        sudo install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        sudo chmod a+r /etc/apt/keyrings/docker.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
        sudo chmod 666 /var/run/docker.sock

    # A release build (git_tag set) pushes (images/Makefile adds --push when
    # GIT_TAG is set), so it needs a working login and fails without one: a
    # release never silently skips its push. A PR build only pulls public
    # images, so it falls back to anonymous pulls. The OIDC token lives at most
    # 60 minutes with no refresh, so the calling job keeps
    # `timeout-minutes: 60` (a composite step cannot set its own timeout).
    - name: Configure DockerHub (push, required)
      if: inputs.git_tag != ''
      uses: ./.github/actions/configure-dockerhub
      with:
        connection-id: ${{ inputs.dockerhub-oidc-connection-id }}

    - name: Configure DockerHub (pull-only)
      if: inputs.git_tag == ''
      uses: ./.github/actions/ci-dockerhub-login
      with:
        connection-id: ${{ inputs.dockerhub-oidc-connection-id }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        platforms: linux/${{ inputs.arch }}

    # Buildx's `type=gha` cache backend needs the ACTIONS_* runtime env vars
    # (ACTIONS_RUNTIME_TOKEN plus either ACTIONS_CACHE_URL for cache v1 or
    # ACTIONS_RESULTS_URL for cache v2), which GitHub does not export to
    # shell steps by default. Re-export every ACTIONS_* variable via the
    # first-party actions/github-script action so buildx can talk to
    # whichever cache backend the runner is configured for.
    - name: Expose GHA runtime to buildx (for type=gha cache backend)
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      with:
        script: |
          for (const [k, v] of Object.entries(process.env)) {
            if (k.startsWith('ACTIONS_') && v) core.exportVariable(k, v);
          }

    # `ignore-error=true` on --cache-to keeps a flaky GitHub Actions cache
    # backend from failing the build: the `type=gha` exporter intermittently
    # 404s ("BlobNotFound") when writing the cache blob, which previously failed
    # an otherwise-successful build (every layer was already built/cached). The
    # cache is a build-speed optimization, never a correctness input, so a failed
    # export must not red the run. --cache-from has no such flag (a cache miss is
    # already non-fatal).
    - name: Build docker image for ${{ inputs.arch }}
      shell: bash
      env:
        BUILDX_CACHE_FLAGS: --cache-from type=gha,scope=${{ inputs.image }}-${{ inputs.arch }} --cache-to type=gha,mode=max,ignore-error=true,scope=${{ inputs.image }}-${{ inputs.arch }}
      run: cd images && make PLATFORMS=linux/${{ inputs.arch }} TAG_SUFFIX=-${{ inputs.arch }} GIT_TAG=${{ inputs.git_tag }} GIT_REVISION=${{ inputs.git_rev }} ${{ inputs.image }}
