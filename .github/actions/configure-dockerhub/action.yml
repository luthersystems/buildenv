name: configure-dockerhub
description: >-
  Log in to Docker Hub with Docker Hub OIDC only, for a job that MUST be
  authenticated: an image push (publish.yml) or a Docker Scout command
  (Scout has no anonymous mode). It uses no stored credential. The calling job
  needs `permissions: id-token: write`. It tries up to three times, then fails
  the job: a push or a Scout gate cannot fall back to anonymous access, so a
  release never silently skips its push.

  Token lifetime: docker/login-action exchanges the GitHub OIDC token at
  https://identity.docker.com/oauth/token for a Docker Hub access token that
  expires after DOCKERHUB_OIDC_EXPIREIN seconds (300-3600). There is no
  refresh: once it expires every registry and Scout call, even a pull of a
  public image, fails with "401 Unauthorized". This action asks for the
  maximum, 3600, so log in right before the Docker work, keep each Docker
  step at `timeout-minutes: 60` or less, and log in again before a later
  long step (see CLAUDE.md, "Docker Hub login").
inputs:
  connection-id:
    description: >-
      Docker Home OIDC connection ID (not a secret; the single place it lives,
      shared with luthersystems/substrate's connection). Override only to test
      another connection.
    required: false
    default: c5a3b4b1-e0dc-4f63-88f4-d71cc0442085
  username:
    description: Docker organization OIDC authenticates as (not a user).
    required: false
    default: luthersystems
  oidc-expires-in:
    description: Lifetime in seconds (300-3600) of the OIDC-issued Docker Hub token.
    required: false
    default: "3600"
runs:
  using: composite
  steps:
    - name: Check OIDC availability
      shell: bash
      env:
        CONNECTION_ID: ${{ inputs.connection-id }}
      run: |
        if [ -z "$CONNECTION_ID" ]; then
          echo "::error title=Docker Hub login::connection-id input is empty (it defaults to the shared connection; see CLAUDE.md, 'Docker Hub login')."
          exit 1
        fi
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error title=Docker Hub login::no id-token; give the job 'permissions: id-token: write' (fork pull requests never get one)"
          exit 1
        fi
    - name: Log in to Docker Hub (OIDC, attempt 1)
      id: oidc1
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        username: ${{ inputs.username }}
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: ${{ inputs.oidc-expires-in }}
    - name: Wait before OIDC retry
      if: steps.oidc1.outcome == 'failure'
      shell: bash
      run: sleep 5
    - name: Log in to Docker Hub (OIDC, attempt 2)
      id: oidc2
      if: steps.oidc1.outcome == 'failure'
      continue-on-error: true
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        username: ${{ inputs.username }}
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: ${{ inputs.oidc-expires-in }}
    - name: Wait before OIDC retry
      if: steps.oidc2.outcome == 'failure'
      shell: bash
      run: sleep 15
    - name: Log in to Docker Hub (OIDC, attempt 3)
      if: steps.oidc2.outcome == 'failure'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        username: ${{ inputs.username }}
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: ${{ inputs.oidc-expires-in }}
